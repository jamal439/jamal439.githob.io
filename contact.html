<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تماس با من | جمال</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #070b1a;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: -1;
        }

        body::before {
            background: #7c3aed;
            top: 50px;
            left: -100px;
        }

        body::after {
            background: #2563eb;
            bottom: 50px;
            right: -100px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(7, 11, 26, 0.75);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;
            padding: 18px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #a78bfa;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #a78bfa;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 100px 20px;
        }

        .box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 25px;

            padding: 50px 30px;

            backdrop-filter: blur(15px);
        }

        .emoji {
            font-size: 55px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .intro {
            text-align: center;
            color: #b8bdd0;
            line-height: 2;
            margin-bottom: 40px;
        }

        .contact-card {
            display: block;

            padding: 25px;
            margin-bottom: 18px;

            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            color: white;
            text-decoration: none;

            transition: 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            border-color: rgba(167,139,250,0.4);
        }

        .contact-card h3 {
            margin-bottom: 10px;
        }

        .contact-card p {
            color: #aeb4c7;
        }

        .button {
            display: block;
            width: fit-content;

            margin: 35px auto 0;

            padding: 14px 28px;

            background: linear-gradient(135deg, #7c3aed, #2563eb);

            color: white;
            text-decoration: none;

            border-radius: 12px;
            font-weight: bold;

            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-4px);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777e93;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        @media (max-width: 700px) {

            .nav-container {
                flex-direction: column;
            }

            nav {
                justify-content: center;
                gap: 14px;
            }

            .container {
                padding: 70px 18px;
            }

            h1 {
                font-size: 32px;
            }

        }

    </style>

</head>

<body>


<header>

    <div class="nav-container">

        <div class="logo">
            جمال 🚀
        </div>

        <nav>

            <a href="index.html">
                خانه
            </a>

            <a href="about.html">
                درباره من
            </a>

            <a href="index.html#services">
                خدمات
            </a>

            <a href="index.html#projects">
                پروژه‌ها
            </a>

            <a href="contact.html">
                تماس
            </a>

        </nav>

    </div>

</header>


<main>

    <div class="container">

        <div class="box">

            <div class="emoji">
                📩
            </div>

            <h1>
                تماس با من
            </h1>

            <p class="intro">
                برای ارتباط می‌تونی از راه‌های زیر استفاده کنی.
            </p>


            <a href="mailto:example@gmail.com" class="contact-card">

                <h3>
                    📧 ایمیل
                </h3>

                <p>
                    example@gmail.com
                </p>

            </a>


            <div class="contact-card">

                <h3>
                    📱 شبکه‌های اجتماعی
                </h3>

                <p>
                    به‌زودی اضافه می‌شود ✨
                </p>

            </div>


            <a href="index.html" class="button">
                برگشت به صفحه اصلی 🏠
            </a>

        </div>

    </div>

</main>


<footer>

    © 2026 | ساخته شده با ❤️ و 🚀

</footer>


</body>

</html>
